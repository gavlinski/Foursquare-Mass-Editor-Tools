name: CI/CD Pipeline - Build and Deploy

on:
  push:
    branches:
      - refactor-ia      # Branch de desenvolvimento/staging
      - main             # Branch de produção (quando fizer merge)
    tags:
      - 'v*'             # Triggers em tags de versão (v3.0.0, v3.1.0, etc)
  pull_request:
    branches:
      - refactor-ia
      - main
  workflow_dispatch:      # Permite trigger manual via UI do GitHub

env:
  PHP_VERSION: '8.1'
  NODE_VERSION: '18'

jobs:
  # ============================================================
  # Job 1: Lint e Validação
  # ============================================================
  lint:
    name: 🔍 Lint & Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip
          coverage: none
      
      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: 🔍 PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
      
      - name: ✅ Validation passed
        run: echo "✅ All validation checks passed!"

  # ============================================================
  # Job 2: Tests (PHPUnit quando implementado)
  # ============================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip
          coverage: xdebug
      
      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist
      
      - name: 🧪 Run PHPUnit tests
        run: |
          if [ -f "phpunit.xml" ]; then
            vendor/bin/phpunit --coverage-text
          else
            echo "⚠️  PHPUnit não configurado ainda - pulando testes"
          fi
      
      - name: ✅ Tests completed
        run: echo "✅ All tests passed!"

  # ============================================================
  # Job 3: Build & Minify Assets
  # ============================================================
  build:
    name: 🔨 Build & Minify
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install npm dependencies
        run: npm install
      
      - name: 🔧 Build and minify JavaScript
        run: bash build.sh
        env:
          BUILD_SOURCE: ci
      
      - name: 📊 Display build stats
        run: |
          echo "📊 Build Statistics:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -lh js/*.min.js || echo "⚠️  No minified files found"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minified-assets
          path: |
            js/*.min.js
            js/*.min.js.map
          retention-days: 7
      
      - name: ✅ Build completed
        run: echo "✅ Build completed successfully!"

  # ============================================================
  # Job 4: Deploy to Production (apenas em push para branches específicas)
  # ============================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/refactor-ia' || github.ref == 'refs/heads/main')
    environment:
      name: production
      url: http://4sq.eliotools.site
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: 📦 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: minified-assets
          path: js/
      
      - name: 🔐 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      
      - name: 📝 Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          # Usa IP direto até migração DNS (novo Droplet)
          ssh-keyscan -H 134.209.163.143 >> ~/.ssh/known_hosts
      
      - name: 🚀 Deploy to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: 134.209.163.143  # IP direto do novo Droplet
          DEPLOY_BRANCH: ${{ github.ref_name }}
          # Application secrets (para atualizar .env no servidor)
          FOURSQUARE_CLIENT_KEY: ${{ secrets.FOURSQUARE_CLIENT_KEY }}
          FOURSQUARE_CLIENT_SECRET: ${{ secrets.FOURSQUARE_CLIENT_SECRET }}
          FOURSQUARE_REDIRECT_URI: ${{ secrets.FOURSQUARE_REDIRECT_URI }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "🚀 Deploying branch: ${DEPLOY_BRANCH}"
          bash deploy.sh
      
      - name: 🔍 Health check
        run: |
          echo "🔍 Checking site health..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://4sq.eliotools.site)
          echo "HTTP Status: ${HTTP_CODE}"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Site is healthy!"
          else
            echo "❌ Site health check failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
      
      - name: ✅ Deployment completed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment completed successfully!"
          echo "🌐 URL: http://4sq.eliotools.site"
          echo "📋 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ============================================================
  # Job 5: Create Release (apenas em tags)
  # ============================================================
  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📝 Generate changelog
        id: changelog
        run: |
          # Pega a tag anterior
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from ${PREVIOUS_TAG} to ${GITHUB_REF_NAME}"
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "First release - using last 20 commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -n 20)
          fi
          
          # Salva changelog para usar no release
          echo "${CHANGELOG}" > CHANGELOG.txt
          echo "changelog_file=CHANGELOG.txt" >> $GITHUB_OUTPUT
      
      - name: 📤 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✅ Release created
        run: echo "✅ Release ${{ github.ref_name }} created successfully!"

  # ============================================================
  # Job 6: Rollback (manual trigger apenas)
  # ============================================================
  rollback:
    name: ⏪ Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    
    steps:
      - name: 🔐 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      
      - name: ⏪ Execute rollback
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh ${DEPLOY_USER}@4sq.eliotools.site << 'EOF'
            set -e
            BACKUP_DIR="/var/backups/4sqmet"
            PRODUCTION_PATH="/var/www/html"
            
            # Pega o backup mais recente
            LATEST_BACKUP=$(ls -t ${BACKUP_DIR}/backup_*.tar.gz | head -n1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "⏪ Restoring from: ${LATEST_BACKUP}"
              cd ${PRODUCTION_PATH}
              tar -xzf ${LATEST_BACKUP}
              systemctl restart apache2
              echo "✅ Rollback completed!"
            else
              echo "❌ No backup found!"
              exit 1
            fi
          EOF
      
      - name: ✅ Rollback completed
        run: echo "✅ Rollback executed successfully!"
