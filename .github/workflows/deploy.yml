name: CI/CD Pipeline - Build and Deploy

on:
  push:
    branches:
      - refactor-ia      # Branch de desenvolvimento/staging
      - main             # Branch de produção (quando fizer merge)
    tags:
      - 'v*'             # Triggers em tags de versão (v3.0.0, v3.1.0, etc)
  pull_request:
    branches:
      - refactor-ia
      - main
  workflow_dispatch:      # Permite trigger manual via UI do GitHub
    inputs:
      action:
        description: 'Ação a executar manualmente'
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.1'
  NODE_VERSION: '18'
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  PRODUCTION_DOMAIN: '4sq.eliotools.site'
  PRODUCTION_URL: ${{ secrets.APP_URL }}

jobs:
  # ============================================================
  # Job 1: Lint e Validação
  # ============================================================
  lint:
    name: 🔍 Lint & Validation
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip
          coverage: none
      
      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: 🔍 PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
      
      - name: ✅ Validation passed
        run: echo "✅ All validation checks passed!"

  # ============================================================
  # Job 2: Tests (PHPUnit quando implementado)
  # ============================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip
          coverage: xdebug
      
      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist
      
      - name: 🧪 Run PHPUnit tests
        run: |
          if [ -f "phpunit.xml" ]; then
            vendor/bin/phpunit --coverage-text
          else
            echo "⚠️  PHPUnit não configurado ainda - pulando testes"
          fi
      
      - name: ✅ Tests completed
        run: echo "✅ All tests passed!"

  # ============================================================
  # Job 3: Build & Minify Assets
  # ============================================================
  build:
    name: 🔨 Build & Minify
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for git describe
      
      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install npm dependencies
        run: npm ci
      
      - name: 🔧 Build and minify JavaScript
        run: bash build.sh
        env:
          BUILD_SOURCE: ci
      
      - name: 📊 Display build stats
        run: |
          echo "📊 Build Statistics:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -lh js/*.min.js || echo "⚠️  No minified files found"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minified-assets
          path: |
            js/*.min.js
            js/*.min.js.map
            build-info.json
          retention-days: 7
      
      - name: ✅ Build completed
        run: echo "✅ Build completed successfully!"

  # ============================================================
  # Job 4: Deploy to Production (apenas em push para branches específicas)
  # ============================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/refactor-ia' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: 📦 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: minified-assets
          path: .  # Download para raiz, mantendo estrutura original (js/*.min.js e build-info.json)
      
      - name: 🔐 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      
      - name: 📝 Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 Deploy to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          # Application secrets (para atualizar .env no servidor)
          FOURSQUARE_CLIENT_KEY: ${{ secrets.FOURSQUARE_CLIENT_KEY }}
          FOURSQUARE_CLIENT_SECRET: ${{ secrets.FOURSQUARE_CLIENT_SECRET }}
          FOURSQUARE_REDIRECT_URI: ${{ secrets.FOURSQUARE_REDIRECT_URI }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID }}
          GOOGLE_MAPS_GEOCODING_KEY: ${{ secrets.GOOGLE_MAPS_GEOCODING_KEY }}
          APP_URL: ${{ env.PRODUCTION_URL }}
        run: |
          echo "🚀 Deploying branch: ${DEPLOY_BRANCH}"
          
          # CRITICAL: Copy build artifacts to server BEFORE running deploy.sh
          # This ensures build-info.json and minified files are available for Docker build
          echo "📤 Copying build artifacts to server..."
          
          # Build-info.json (root directory)
          if [ -f "build-info.json" ]; then
            scp -o StrictHostKeyChecking=no -o BatchMode=yes \
              build-info.json \
              ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/4sqmet/
            echo "✅ build-info.json copied"
          else
            echo "⚠️  build-info.json not found - will use defaults"
          fi
          
          # Minified JavaScript files
          if ls js/*.min.js 1> /dev/null 2>&1; then
            scp -o StrictHostKeyChecking=no -o BatchMode=yes \
              js/*.min.js js/*.min.js.map \
              ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/4sqmet/js/
            echo "✅ Minified assets copied"
          else
            echo "⚠️  Minified assets not found"
          fi
          
          echo ""
          bash deploy.sh
      
      - name: 🔍 Health check
        run: |
          echo "🔍 Checking site health..."
          echo "⏳ Aguardando Apache inicializar (15 segundos)..."
          sleep 15
          
          # Testar HTTPS com retry
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🔄 Tentativa $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            HTTPS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.PRODUCTION_URL }}/ || echo "000")
            echo "   HTTPS Status: ${HTTPS_CODE}"
            
            if [ "$HTTPS_CODE" = "200" ] || [ "$HTTPS_CODE" = "302" ]; then
              echo "✅ Site is healthy (HTTPS working)!"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "   ⏳ Aguardando 10 segundos antes de tentar novamente..."
              sleep 10
            fi
          done
          
          # Se chegou aqui, falhou todas as tentativas
          echo "❌ Site health check failed after $MAX_RETRIES attempts"
          echo "📊 Diagnóstico:"
          echo "   - Tentando HTTPS novamente para diagnóstico..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://${{ env.PRODUCTION_DOMAIN }}/ || echo "000")
          echo "   - HTTPS Status: ${HTTP_CODE}"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "⚠️  HTTPS responde parcialmente, mas o health check principal falhou - verificar certificados SSL ou headers"
            exit 1
          else
            echo "❌ HTTP e HTTPS falharam - container pode não estar respondendo"
            echo "🔧 Execute manualmente no servidor:"
            echo "   ssh root@4sq.eliotools.site 'docker logs --tail 50 4sqmet'"
            exit 1
          fi
      
      - name: ✅ Deployment completed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment completed successfully!"
          echo "🌐 URL: ${{ env.PRODUCTION_URL }}"
          echo "📋 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ============================================================
  # Job 5: Create Release (apenas em tags)
  # ============================================================
  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📝 Generate changelog
        id: changelog
        run: |
          # Pega a tag anterior
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from ${PREVIOUS_TAG} to ${GITHUB_REF_NAME}"
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "First release - using last 20 commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -n 20)
          fi
          
          # Salva changelog para usar no release
          echo "${CHANGELOG}" > CHANGELOG.txt
          echo "changelog_file=CHANGELOG.txt" >> $GITHUB_OUTPUT
      
      - name: 📤 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✅ Release created
        run: echo "✅ Release ${{ github.ref_name }} created successfully!"

  # ============================================================
  # Job 6: Rollback (manual trigger apenas)
  # ============================================================
  rollback:
    name: ⏪ Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: production
    
    steps:
      - name: 🔐 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 📝 Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: ⏪ Execute rollback
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh ${DEPLOY_USER}@${{ env.DEPLOY_HOST }} << 'EOF'
            set -e
            BACKUP_DIR="/var/backups/4sqmet"
            PRODUCTION_PATH="/var/www/4sqmet"
            
            # Pega o backup mais recente
            LATEST_BACKUP=$(ls -t ${BACKUP_DIR}/backup_*.tar.gz | head -n1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "⏪ Restoring from: ${LATEST_BACKUP}"
              cd ${PRODUCTION_PATH}
              tar -xzf ${LATEST_BACKUP}

              if docker ps --format '{{.Names}}' | grep -q '^4sqmet$'; then
                docker restart 4sqmet
              else
                docker run -d \
                  --name 4sqmet \
                  --restart unless-stopped \
                  -p 80:80 \
                  -p 443:443 \
                  --env-file .env \
                  -v /var/www/4sqmet:/var/www/html \
                  -v /etc/letsencrypt:/etc/letsencrypt:ro \
                  4sqmet:latest >/dev/null
              fi

              echo "✅ Rollback completed!"
            else
              echo "❌ No backup found!"
              exit 1
            fi
          EOF
      
      - name: ✅ Rollback completed
        run: echo "✅ Rollback executed successfully!"
