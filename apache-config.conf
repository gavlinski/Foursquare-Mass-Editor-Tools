# ====================================
# HTTPS Configuration (Port 443)
# ====================================
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html
    
    # ============================================================
    # Alias para Desenvolvimento - Serve em /4sqmet/
    # ============================================================
    Alias /4sqmet /var/www/html
    
    # ============================================================
    # SSL Configuration
    # ============================================================
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/localhost.pem
    SSLCertificateKeyFile /etc/ssl/private/localhost-key.pem
    
    # SSL Protocol and Cipher Configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    
    # HSTS (HTTP Strict Transport Security)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # ============================================================
    # Diretório Principal
    # ============================================================
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>
    
    # Permite reescrita de URLs
    RewriteEngine On

    # Bloqueia probes automatizados e payloads comuns de exploração
    RewriteCond %{REQUEST_URI} (_ignition/execute-solution|nonexistentroute) [NC,OR]
    RewriteCond %{QUERY_STRING} (xdebug_session_start|allow_url_include|auto_prepend_file|php://input|php%3a%2f%2finput|pearcmd|config-create|invokefunction|call_user_func_array|\.\./|\.\.%2f|%2e%2e%2f|%5c) [NC]
    RewriteRule ^ - [F,L]
    
    # Redireciona callback para index.php
    RewriteCond %{QUERY_STRING} code=
    RewriteRule ^/?$ /4sqmet/index.php [L,QSA]
    
    # ============================================================
    # Compressão Gzip (mod_deflate) - Otimização de Performance
    # ============================================================
    <IfModule mod_deflate.c>
        # Comprime HTML, CSS, JavaScript, JSON, XML
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/xml application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml application/atom+xml
        AddOutputFilterByType DEFLATE image/svg+xml
        AddOutputFilterByType DEFLATE application/vnd.ms-fontobject
        AddOutputFilterByType DEFLATE application/x-font-ttf application/x-font-opentype
        
        # Remove etag (reduz overhead)
        Header unset ETag
        FileETag None
        
        # Evita compressão de arquivos já comprimidos
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|zip|gz|rar|bz2|7z)$ no-gzip dont-vary
        
        # Handle browser-specific compression
        <IfModule mod_setenvif.c>
            BrowserMatch ^Mozilla/4 gzip-only-text/html
            BrowserMatch ^Mozilla/4\.0[678] no-gzip
            BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
            BrowserMatch \bMSI[E] !no-gzip !gzip-only-text/html
        </IfModule>
        
        # Add Vary header for proxy caches
        <IfModule mod_headers.c>
            Header append Vary Accept-Encoding env=!dont-vary
        </IfModule>
    </IfModule>
    
    # ============================================================
    # Cache Headers - Otimização de Assets Estáticos
    # ============================================================
    <IfModule mod_expires.c>
        ExpiresActive On
        
        # Imagens (cache por 1 ano)
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"
        
        # CSS e JavaScript (cache por 1 mês)
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/x-javascript "access plus 1 month"
        
        # Fontes (cache por 1 ano)
        ExpiresByType font/ttf "access plus 1 year"
        ExpiresByType font/otf "access plus 1 year"
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType application/font-woff "access plus 1 year"
        
        # HTML, JSON, XML (sem cache)
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType application/json "access plus 0 seconds"
        ExpiresByType application/xml "access plus 0 seconds"
        ExpiresByType text/xml "access plus 0 seconds"
        
        # Default
        ExpiresDefault "access plus 1 week"
    </IfModule>
    
    # Cache-Control headers para assets versionados (.min.js)
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf)$">
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </FilesMatch>
    
    # Sem cache para arquivos dinâmicos
    <FilesMatch "\.(php|html)$">
        <IfModule mod_headers.c>
            Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </IfModule>
    </FilesMatch>
    
    # ============================================================
    # Segurança
    # ============================================================
    <IfModule mod_headers.c>
        # Previne clickjacking
        Header always set X-Frame-Options DENY
        
        # Previne MIME sniffing
        Header always set X-Content-Type-Options nosniff
        
        # XSS Protection
        Header always set X-XSS-Protection "1; mode=block"
        
        # Referrer Policy
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # Content Security Policy (ajuste conforme necessário)
        # Inclui ajax.googleapis.com no style-src para Dojo CDN
        Header always set Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://ajax.googleapis.com https://maps.googleapis.com https://api.foursquare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ajax.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://*.foursquare.com;"
    </IfModule>
    
    # ============================================================
    # Logs
    # ============================================================
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    
    # ============================================================
    # Diretório Principal
    # ============================================================
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# ====================================
# HTTP to HTTPS Redirect (Port 80)
# ====================================
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    
    # Redirect permanente para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    # Logs
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
